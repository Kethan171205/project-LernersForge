services:
  - type: web
    name: learnersforge-backend
    env: node
    region: singapore          # closest to India
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false            # you'll paste the key in Render's dashboard
